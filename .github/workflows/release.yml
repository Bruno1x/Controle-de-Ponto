name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag inválida: ${{ github.ref_name }}" }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller xlrd==2.0.2 "openpyxl>=3.1,<4" "reportlab>=4.2,<5"

      - name: Build standalone Windows application
        env:
          CONTROLE_PONTO_VERSION: ${{ github.ref_name }}
        run: pyinstaller --clean --noconfirm ControleDePonto-Miranda-AlmocoFixo.spec

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist\ControleDePonto-Miranda-Revisado.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Executável não gerado: $exe" }
          gh release create $tag $exe --title "Controle de Ponto $tag" --generate-notes --verify-tag
